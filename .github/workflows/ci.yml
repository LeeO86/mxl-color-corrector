name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: packages
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config g++ git ca-certificates
      - name: web
        run: cd web && npm ci && npm run build
      - name: cmake
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: build
        run: cmake --build build -j
      - name: unit
        run: ./build/unit-tests
      - name: bench (this tree, then main on the same runner)
        run: |
          ./build/mxl-cc-bench
          git fetch --depth 1 origin main
          git worktree add /tmp/cc-main FETCH_HEAD
          cmake -S /tmp/cc-main -B /tmp/cc-main/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCC_WITH_MXL=OFF -DCC_BUILD_TESTS=OFF > /dev/null
          cmake --build /tmp/cc-main/build --target mxl-cc-bench > /dev/null
          echo "--- main"
          /tmp/cc-main/build/mxl-cc-bench
      - name: integration
        run: python3 tests/integration/correct.py
        env:
          CC_BUILD: build
      - name: lifecycle
        run: python3 tests/integration/lifecycle.py
        env:
          CC_BUILD: build
