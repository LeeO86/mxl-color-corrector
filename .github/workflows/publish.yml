name: publish

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: tags
        id: tags
        run: |
          set -eu
          image=ghcr.io/leeo86/mxl-color-corrector
          sha7=$(git rev-parse --short=7 HEAD)
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            ver="${GITHUB_REF#refs/tags/v}"
            [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            major="${ver%%.*}"
            minor="${ver%.*}"
            echo "list=${image}:${ver},${image}:${minor},${image}:${major}" >> "$GITHUB_OUTPUT"
          else
            echo "list=${image}:git-${sha7},${image}:nightly-dev" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=https://github.com/LeeO86/mxl-color-corrector
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
            io.dmf.mxl.revision=218ddaa0a08c12ffe75fc475ae65aa3d9eef16d7
      - name: keep the package public
        run: |
          set +e
          gh api --method PATCH "/user/packages/container/mxl-color-corrector" -f visibility=public
          gh api --method PATCH "/orgs/LeeO86/packages/container/mxl-color-corrector" -f visibility=public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
