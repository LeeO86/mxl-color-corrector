# Local demo only. The platform Deployment in deploy/k8s uses the pod network.
# This file uses the host network so the demo processes share one MXL directory.
# mxl-webrtc-monitor is optional: `docker compose --profile monitor up`.
services:
  registry:
    image: python:3.12-alpine
    network_mode: host
    command: ["python", "-u", "/registry.py"]
    volumes:
      - ../tests/integration/fake_registry.py:/registry.py:ro

  pattern:
    image: ghcr.io/leeo86/mxl-color-corrector:1.0.3
    network_mode: host
    user: "1000:1000"
    entrypoint: ["/usr/local/bin/mxl-cc-pattern"]
    command:
      - --domain
      - /Volumes/mxl/bars
      - --domain-id
      - 11111111-1111-4111-8111-111111111111
      - --flow-id
      - 22222222-2222-4222-8222-222222222222
      - --seconds
      - "86400"
      - --slices
      - "16"
      - --sleep-us
      - "80"
    volumes:
      - mxl:/Volumes/mxl

  corrector:
    image: ghcr.io/leeo86/mxl-color-corrector:1.0.3
    network_mode: host
    user: "1000:1000"
    depends_on:
      - pattern
    environment:
      CC_CHANNELS: "1"
      MXL_DOMAIN_SCAN_PATH: /Volumes/mxl
      MXL_OUTPUT_DOMAIN_DIR: /Volumes/mxl/cc
      MXL_OUTPUT_DOMAIN_ID: 33333333-3333-4333-8333-333333333333
      NMOS_REGISTRY_ADDRESS: 127.0.0.1
      NMOS_REGISTRY_PORT: "3210"
      NMOS_QUERY_ADDRESS: 127.0.0.1
      NMOS_QUERY_PORT: "3210"
      NMOS_DNS_SD: "false"
      WEB_PORT: "8140"
      NMOS_PORT: "3292"
      CC_STATE_DIR: /config
    volumes:
      - mxl:/Volumes/mxl
      - config:/config

  monitor:
    profiles: ["monitor"]
    image: ghcr.io/leeo86/mxl-webrtc-monitor:latest
    network_mode: host
    environment:
      MXL_DOMAIN_SCAN_PATH: /Volumes/mxl
    volumes:
      - mxl:/Volumes/mxl

volumes:
  mxl:
  config:
